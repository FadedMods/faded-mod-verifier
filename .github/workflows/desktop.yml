name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, codex/desktop-verifier]
    paths:
      - .github/workflows/desktop.yml
      - requirements-desktop.txt
      - scripts/desktop_entry.py
      - src/**
      - tests/**
      - pyproject.toml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libtk8.6 xvfb
      - run: python -m pip install -r requirements-desktop.txt .
      - run: python -m unittest discover -s tests
      - name: Bundle the app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name FadedModVerifier --collect-data faded_mod_verifier --copy-metadata faded-mod-verifier --copy-metadata tkinterdnd2 --copy-metadata yara-python --add-data "LICENSE:." scripts/desktop_entry.py
      - name: Exercise the standalone Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $desktopReport = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $nativeTest = Start-Process -FilePath (Resolve-Path 'dist/FadedModVerifier.exe') -ArgumentList '--desktop-smoke', ('"' + $desktopReport + '"') -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $desktopReport
          if ($nativeTest.ExitCode -ne 0) { exit $nativeTest.ExitCode }
          Rename-Item -LiteralPath 'dist/FadedModVerifier.exe' -NewName 'FadedModVerifier-0.2.0-windows-x64.exe'
      - name: Exercise the standalone Linux app
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./dist/FadedModVerifier --desktop-smoke "$RUNNER_TEMP/desktop-smoke.json"
          cat "$RUNNER_TEMP/desktop-smoke.json"
          tar -C dist -czf dist/FadedModVerifier-0.2.0-linux-x86_64.tar.gz FadedModVerifier
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/FadedModVerifier-0.2.0-*
            ${{ runner.temp }}/desktop-smoke.json
          if-no-files-found: error
